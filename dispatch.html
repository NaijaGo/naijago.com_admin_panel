<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispatch Map | NaijaGo Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQmpqMQtIdZl8lLn7lG63QX4Fw5oQJw="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <link rel="stylesheet" href="css/admin-panel.css" />
  </head>
  <body class="p-8" data-page="dispatch">
    <div class="container mx-auto">
      <div class="mb-8 flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="mb-2 text-sm font-semibold uppercase tracking-[0.35em] text-accent-cyan">
            Live Dispatch
          </p>
          <h1 class="shimmer-text text-5xl font-extrabold text-light-slate">
            Dispatch Map
          </h1>
          <p class="mt-3 max-w-2xl text-light-gray">
            Monitor online riders, pending assignments, GPS freshness, and pickup distance in one view.
          </p>
        </div>
        <button id="logoutAdminBtn" class="btn btn-danger self-start rounded-lg px-6 py-3 text-sm md:self-auto">
          Logout
        </button>
      </div>

      <nav class="mb-8 grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <a href="index.html" class="btn btn-primary-alt px-4 py-3 text-center text-sm">Dashboard</a>
        <a href="orders.html" class="btn btn-primary-alt px-4 py-3 text-center text-sm">Orders</a>
        <a href="dispatch.html" class="btn btn-primary px-4 py-3 text-center text-sm">Dispatch Map</a>
        <a href="riders.html" class="btn btn-primary-alt px-4 py-3 text-center text-sm">Riders</a>
        <a href="vendors.html" class="btn btn-primary-alt px-4 py-3 text-center text-sm">Vendors</a>
        <a href="withdrawals.html" class="btn btn-primary-alt px-4 py-3 text-center text-sm">Withdrawals</a>
      </nav>

      <div id="messageContainer" class="mb-4"></div>

      <section class="grid gap-4 md:grid-cols-4">
        <article class="card p-4">
          <p class="text-sm text-light-gray">Online riders</p>
          <p id="dispatchOnlineCount" class="mt-2 text-3xl font-black text-accent-cyan">0</p>
        </article>
        <article class="card p-4">
          <p class="text-sm text-light-gray">Fresh GPS</p>
          <p id="dispatchFreshGpsCount" class="mt-2 text-3xl font-black text-green-300">0</p>
        </article>
        <article class="card p-4">
          <p class="text-sm text-light-gray">Pending offers</p>
          <p id="dispatchPendingCount" class="mt-2 text-3xl font-black text-yellow-300">0</p>
        </article>
        <article class="card p-4">
          <p class="text-sm text-light-gray">Active deliveries</p>
          <p id="dispatchActiveCount" class="mt-2 text-3xl font-black text-light-slate">0</p>
        </article>
      </section>

      <section class="mt-6 grid gap-6 xl:grid-cols-[1.4fr_1fr]">
        <div class="card overflow-hidden p-0">
          <div id="dispatchMap" class="h-[620px] w-full bg-[#10203D]"></div>
        </div>
        <div class="space-y-6">
          <section class="card p-5">
            <div class="mb-4 flex items-center justify-between">
              <h2 class="text-2xl font-bold text-accent-cyan">Riders</h2>
              <button id="refreshDispatchBtn" class="btn btn-primary-alt px-4 py-2 text-sm">Refresh</button>
            </div>
            <div id="dispatchRiderList" class="space-y-3"></div>
          </section>
          <section class="card p-5">
            <h2 class="mb-4 text-2xl font-bold text-accent-cyan">Orders Needing Dispatch</h2>
            <div id="dispatchOrderList" class="space-y-3"></div>
          </section>
        </div>
      </section>
    </div>

    <script src="js/admin/runtime.js"></script>
    <script src="js/admin/dispatch.js"></script>
    <script src="js/admin-panel.js"></script>
  </body>
</html>
